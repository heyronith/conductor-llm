[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ccpt"
version = "0.1.0"
description = "Constitutional Control-Plane Transformer (CCPT) Research Prototype"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
data = [
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "datasets>=2.19.0",
    "huggingface_hub>=0.23.0",
    "pyarrow>=15.0.0",
    "numpy>=1.24.0",
]
modal = [
    "modal>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "matplotlib>=3.9.4",
]

